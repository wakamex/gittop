[package]
name = "gittop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Live view of your latest Git activity across every repository under a folder"
readme = "README.md"
license = "MIT"
repository = "https://github.com/wakamex/gittop"
keywords = ["git", "tui", "monitor", "repositories", "activity"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
