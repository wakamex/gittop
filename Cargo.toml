[package]
name = "gittop"
version = "0.1.0"
edition = "2024"
description = "Live view of your latest Git activity across every repository under a folder"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
