name: Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --dry-run --locked

  # Builds with the oldest Rust the README and rust-version promise.
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 build --locked

  validate:
    if: always()
    needs: [test, minimum-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: wakamex/release-actions/validate-gate@stable
        with:
          needs: ${{ toJSON(needs) }}
